    <script>
        let selectedColor = '#ffd966';
        let notes = [];
        let editingNoteId = null;
        let draggedNoteId = null;
        let recognition = null;
        let isListening = false;

        let pluginFileHandle = null;  // File System Access API handle

        // ── Conversione formato myAssistente ─────────────────────────────────

        function stripHtml(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<\/p>/gi, '\n')
                .replace(/<[^>]+>/g, '');
            return tmp.textContent.trim();
        }

        function ricavaTitolo(titoloInput, testoPulito) {
            const t = titoloInput.trim();
            if (t) return t;
            const parole = testoPulito.split(/\s+/);
            return parole.slice(0, 6).join(' ') + (parole.length > 6 ? '\u2026' : '');
        }

        function noteToPlugin(nota) {
            const pulito = stripHtml(nota.text);
            return {
                nome:    ricavaTitolo(nota.titolo || '', pulito),
                dati:    pulito,
                tag:     ['nota'],
                soggetto: 'utente',
                colore:  nota.color,
                _plugin: 'note',
                _id:     nota.id,
                _data:   nota.date,
                _html:   nota.text,
                _titolo: nota.titolo || ''
            };
        }

        function pluginToNote(v) {
            return {
                id:     v._id     || Date.now(),
                titolo: v._titolo || v.nome || '',
                text:   v._html   || v.dati.replace(/\n/g, '<br/>\n'),
                color:  v.colore  || '#ffd966',
                date:   v._data   || new Date().toLocaleString('it-IT')
            };
        }

        // ── File System Access API ─────────────────────────────────────────

        function openHandleDB() {
            return new Promise((res, rej) => {
                const req = indexedDB.open('noteVOCALE_db', 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore('handles');
                req.onsuccess = e => res(e.target.result);
                req.onerror   = e => rej(e.target.error);
            });
        }

        async function savePluginHandle(handle) {
            pluginFileHandle = handle;
            try {
                const db = await openHandleDB();
                const tx = db.transaction('handles', 'readwrite');
                tx.objectStore('handles').put(handle, 'pluginHandle');
                await new Promise(r => { tx.oncomplete = r; });
                db.close();
            } catch(e) { console.warn('[noteVOCALE] Handle non persistito:', e); }
        }

        async function loadPluginHandle() {
            try {
                const db = await openHandleDB();
                const tx = db.transaction('handles', 'readonly');
                const req = tx.objectStore('handles').get('pluginHandle');
                req.onsuccess = async e => {
                    if (e.target.result) {
                        const perm = await e.target.result.queryPermission({ mode: 'readwrite' });
                        if (perm === 'granted') pluginFileHandle = e.target.result;
                    }
                };
                db.close();
            } catch(e) { /* IndexedDB non disponibile */ }
        }

        async function saveToPlugin() {
            if (!window.showSaveFilePicker) {
                alert('Usa Chrome o Edge per questa funzione.\nAlternativa: usa Backup JSON.');
                return;
            }
            try {
                if (pluginFileHandle) {
                    const perm = await pluginFileHandle.requestPermission({ mode: 'readwrite' });
                    if (perm !== 'granted') pluginFileHandle = null;
                }
                if (!pluginFileHandle) {
                    pluginFileHandle = await window.showSaveFilePicker({
                        suggestedName: 'myNote.json',
                        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
                        startIn: 'documents'
                    });
                    await savePluginHandle(pluginFileHandle);
                }
                const writable = await pluginFileHandle.createWritable();
                await writable.write(JSON.stringify(notes.map(noteToPlugin), null, 2));
                await writable.close();
                showCopyNotification('\u2713 Salvato per Assistente!');
            } catch(e) {
                if (e.name !== 'AbortError') alert('Errore salvataggio: ' + e.message);
            }
        }

        async function autoSavePlugin() {
            if (!pluginFileHandle) return;
            try {
                const perm = await pluginFileHandle.queryPermission({ mode: 'readwrite' });
                if (perm !== 'granted') return;
                const writable = await pluginFileHandle.createWritable();
                await writable.write(JSON.stringify(notes.map(noteToPlugin), null, 2));
                await writable.close();
            } catch(e) { console.warn('[noteVOCALE] Auto-save fallito:', e); }
        }


        // Carica note dal localStorage all'avvio
        window.onload = function() {
            loadNotes();
            loadTheme();
            loadPluginHandle();
            renderNotes();
            initVoiceRecognition();
            if (notes.length === 0) { toggleControls(); }
        };

function triggerFileInput() {

}

        // Funzione per formattare il testo selezionato
        function formatText(type) {
            const textarea = document.getElementById('noteText');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            
            // Il pulsante "a capo" funziona senza selezione
            if (type === 'break') {
                // Inserisce <br/> e va a capo
                const beforeCursor = textarea.value.substring(0, start);
                const afterCursor = textarea.value.substring(end);
                textarea.value = beforeCursor + '<br/>\n' + afterCursor;
                
                // Posiziona il cursore dopo <br/>\n
                const newPosition = start + 6; // lunghezza di '<br/>\n'
                textarea.setSelectionRange(newPosition, newPosition);
                textarea.focus();
                return;
            }
            
            if (!selectedText) {
                alert('Seleziona del testo da formattare!');
                return;
            }
            
            let formattedText = '';
            
            switch(type) {
                case 'bold':
                    formattedText = `<b>${selectedText}</b>`;
                    break;
                case 'italic':
                    formattedText = `<i>${selectedText}</i>`;
                    break;
                case 'link':
                    const url = prompt('Inserisci l\'URL del link:', 'https://');
                    if (url && url !== 'https://') {
                        formattedText = `<a href="${url}" target="_blank">${selectedText}</a>`;
                    } else {
                        return;
                    }
                    break;
                case 'copy':
                    formattedText = `<span onclick="copiaNeglAppunti(this)" style="cursor: pointer; text-decoration: underline;">${selectedText}</span>`;
                    break;
            }
            
            // Sostituisce il testo selezionato con quello formattato
            textarea.value = textarea.value.substring(0, start) + formattedText + textarea.value.substring(end);
            
            // Posiziona il cursore dopo il testo inserito
            const newPosition = start + formattedText.length;
            textarea.setSelectionRange(newPosition, newPosition);
            textarea.focus();
        }

        // Funzione per copiare il testo negli appunti
        function copiaNeglAppunti(elemento) {
            const testo = elemento.textContent.trim();
            
            // Usa l'API moderna se disponibile
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(testo).then(() => {
                    // Feedback visivo
                    const originalBg = elemento.style.backgroundColor;
                    elemento.style.backgroundColor = 'rgba(52, 168, 83, 0.3)';
                    setTimeout(() => {
                        elemento.style.backgroundColor = originalBg;
                    }, 300);
                    
                    // Mostra un piccolo messaggio
                    showCopyNotification();
                }).catch(err => {
                    console.error('Errore nella copia:', err);
                    fallbackCopy(testo);
                });
            } else {
                fallbackCopy(testo);
            }
        }

        // Metodo di fallback per la copia
        function fallbackCopy(testo) {
            const textarea = document.createElement('textarea');
            textarea.value = testo;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showCopyNotification();
            } catch (err) {
                alert('Impossibile copiare il testo');
            }
            document.body.removeChild(textarea);
        }

        // Mostra notifica di copia
        function showCopyNotification(msg) {
            const notification = document.createElement('div');
            notification.textContent = msg || '✓ Copiato!';
            notification.style.cssText = `
                position: fixed;
                top: 80px;
                right: 20px;
                background: #34a853;
                color: white;
                padding: 12px 20px;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 10000;
                animation: slideIn 0.3s;
            `;
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s';
                setTimeout(() => document.body.removeChild(notification), 300);
            }, 2000);
        }

        // Inizializza il riconoscimento vocale
        function initVoiceRecognition() {
            const voiceButton = document.getElementById('voiceButton');
            
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'it-IT';
                
                recognition.onstart = function() {
                    isListening = true;
                    voiceButton.classList.add('listening');
                    voiceButton.textContent = '⏹';
                    voiceButton.title = "Ascoltando... clicca per fermare";
                };
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    const noteText = document.getElementById('noteText');
                    
                    if (noteText.value.trim() === '') {
                        noteText.value = transcript;
                    } else {
                        noteText.value += ' ' + transcript;
                    }
                };
                
                recognition.onerror = function(event) {
                    console.error('Errore di riconoscimento vocale:', event.error);
                    if (event.error === 'no-speech') {
                        alert('Nessun parlato rilevato. Riprova.');
                    } else if (event.error === 'audio-capture') {
                        alert('Microfono non trovato o non accessibile.');
                    } else if (event.error === 'not-allowed') {
                        alert('Permesso al microfono negato. Abilita il microfono nelle impostazioni del browser.');
                    }
                };
                
                recognition.onend = function() {
                    isListening = false;
                    voiceButton.classList.remove('listening');
                    voiceButton.textContent = '🎤';
                    voiceButton.title = "Dettatura vocale";
                };
                
                voiceButton.addEventListener('click', function() {
                    if (isListening) {
                        recognition.stop();
                    } else {
                        try {
                            recognition.start();
                        } catch (error) {
                            alert('Errore nell\'avvio del riconoscimento vocale: ' + error.message);
                        }
                    }
                });
            } else {
                voiceButton.disabled = true;
                voiceButton.title = "Dettatura vocale non supportata dal tuo browser";
                voiceButton.style.opacity = '0.5';
                voiceButton.style.cursor = 'not-allowed';
                console.warn('Il riconoscimento vocale non è supportato da questo browser.');
            }
        }

        function toggleControls() {
            const content = document.getElementById('controlsContent');
            const icon = document.getElementById('toggleIcon');
            
            content.classList.toggle('closed');
            
            if (content.classList.contains('closed')) {
                icon.textContent = '+';
            } else {
                icon.textContent = '−'; 
            }
        }
        
        // Gestione selezione colore
        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                this.classList.add('selected');
                selectedColor = this.dataset.color;
            });
        });

        function addNote() {
            const text   = document.getElementById('noteText').value.trim();
            const titolo = document.getElementById('noteTitolo').value.trim();
            if (text === '') { alert('Inserisci del testo per la nota!'); return; }
            const note = {
                id:     Date.now(),
                titolo: titolo,
                text:   text,
                color:  selectedColor,
                date:   new Date().toLocaleString('it-IT')
            };
            notes.push(note);
            saveNotes();
            renderNotes();
            autoSavePlugin();
            document.getElementById('noteText').value   = '';
            document.getElementById('noteTitolo').value = '';
            if (!document.getElementById('controlsContent').classList.contains('closed')) {
                toggleControls();
            }
        }

        function editNote(id) {
            editingNoteId = id;
            renderNotes();
        }

        function saveEdit(id) {
            const textarea = document.getElementById(`edit-${id}`);
            const newText = textarea.value.trim();
            
            if (newText === '') {
                alert('Il testo della nota non può essere vuoto!');
                return;
            }
            
            const note = notes.find(n => n.id === id);
            if (note) {
                note.text = newText;
                note.date = new Date().toLocaleString('it-IT');
                saveNotes();
                autoSavePlugin();
            }
            editingNoteId = null;
            renderNotes();
        }

        function cancelEdit() {
            editingNoteId = null;
            renderNotes();
        }

        function deleteNote(id) {
            if (confirm('Sei sicuro di voler eliminare questa nota?')) {
                notes = notes.filter(note => note.id !== id);
                saveNotes();
                renderNotes();
                autoSavePlugin();
            }
        }

        function saveNotes() {
            localStorage.setItem('postit-notes', JSON.stringify(notes));
        }

        function loadNotes() {
            const stored = localStorage.getItem('postit-notes');
            if (stored) {
                notes = JSON.parse(stored);
            }
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            
            if (notes.length === 0) {
                grid.innerHTML = '<div class="empty-state">Ancora nessuna nota ✨</div>';
                return;
            }
            
            grid.innerHTML = notes.map(note => {
                const isEditing = editingNoteId === note.id;
                
                if (isEditing) {
                    return `
                        <div class="note" style="background-color: ${note.color}" data-id="${note.id}">
                            <textarea class="note-text-edit" id="edit-${note.id}">${note.text}</textarea>
                            <div class="note-footer">
                                <span class="note-date">${note.date}</span>
                                <div class="note-actions">
                                    <button class="btn-save-edit" onclick="saveEdit(${note.id})">💾</button>
                                    <button class="btn-cancel-edit" onclick="cancelEdit()">✖</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="note" style="background-color: ${note.color}" draggable="true" data-id="${note.id}" 
                             ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="drop(event)" ondragend="dragEnd(event)">
                            <div class="note-text">${note.text}</div>
                            <div class="note-footer">
                                <span class="note-date">${note.date}</span>
                                <div class="note-actions">
                                    <button class="btn-edit" onclick="editNote(${note.id})">✏️</button>
                                    <button class="btn-delete" onclick="deleteNote(${note.id})">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        function dragStart(e) {
            draggedNoteId = parseInt(e.target.dataset.id);
            e.target.classList.add('dragging');
        }

        function dragOver(e) {
            e.preventDefault();
        }

        function drop(e) {
            e.preventDefault();
            const targetId = parseInt(e.currentTarget.dataset.id);
            
            if (draggedNoteId !== targetId) {
                const draggedIndex = notes.findIndex(n => n.id === draggedNoteId);
                const targetIndex = notes.findIndex(n => n.id === targetId);
                
                const [draggedNote] = notes.splice(draggedIndex, 1);
                notes.splice(targetIndex, 0, draggedNote);
                
                saveNotes();
                renderNotes();
            }
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
            draggedNoteId = null;
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
            }
        }

        function saveToFile() {
            const data = JSON.stringify(notes, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `note_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loaded = JSON.parse(e.target.result);
                    if (!Array.isArray(loaded)) { alert('File non valido!'); return; }
                    // Rileva formato plugin (campo "nome") oppure interno (campo "text")
                    if (loaded.length > 0 && loaded[0].nome !== undefined && loaded[0].text === undefined) {
                        notes = loaded.map(pluginToNote);
                    } else {
                        notes = loaded;
                    }
                    saveNotes();
                    renderNotes();
                    alert('Note caricate con successo!');
                } catch (error) {
                    alert('Errore nel caricamento del file!');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        document.getElementById('noteText').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                addNote();
            }
        });

        // Aggiungi stili per le animazioni
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
